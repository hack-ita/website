name: Scheduled Publish

on:
  schedule:
    # Runs at 00:30 UTC daily (01:30 CET/02:30 CEST Italy time): after midnight UTC, so Hugo no longer sees
    # today's posts (dated 00:00 UTC) as future posts. The push below triggers ONE Netlify build, and only on
    # nights when a post is actually published (before, a scheduled function rebuilt the site every night).
    - cron: "30 0 * * *"
  workflow_dispatch: # Manual trigger option

permissions:
  contents: write # Required to push changes

jobs:
  publish_posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install gray-matter date-fns date-fns-tz

      - name: Publish scheduled posts
        id: publish
        run: node .github/scripts/schedule.js

      - name: Check for changes
        id: check_changes
        run: |
          # Only check for changes in content/ directory
          if [[ -n $(git status --porcelain content/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected in content/, will commit"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes to commit"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "🤖 Publish scheduled posts
          
          Published on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push
          
          echo "✅ Changes pushed to repository"
          echo "ℹ️  This push triggers the Netlify production build"

      - name: Workflow summary
        if: always()
        run: |
          echo "## 📅 Scheduled Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ **Posts published and pushed to repository**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **This push triggers the Netlify production build**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No posts were ready to publish**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow run:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
