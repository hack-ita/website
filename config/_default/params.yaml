description: 'Cybersecurity offensiva in italiano: exploit, red team, Active Directory, hacking e vulnerability assessment. Blog per ethical hacker e pentesting di web app'
reading_speed: 315
# Site-wide og:image / twitter:image fallback for pages without their own.
# Hugo's embedded opengraph template reads `images` (plural).
images:
  - /images/hackita-hero.webp
header:
  logo: /images/logo-wobg.png
  cta:
    enable: true
    label: Contattami
    link: /contatto/
footer:
  logo: /images/logo.webp
  disclaimer: 'HACKITA promuove esclusivamente la cybersecurity etica e legale. Tutti i contenuti, laboratori e materiali presenti sul sito hanno scopo educativo e formativo. Non incoraggiamo né supportiamo in alcun modo attività illegali o dannose. L’utilizzo improprio delle informazioni fornite è sotto la piena responsabilità dell’utente.'
# Real Hackita profile URLs pending. Empty values are intentional: the footer
# wraps each icon in `{{ with site.Params.social.<net> }}`, so a blank value
# hides that icon instead of linking to the network's homepage. Fill in the
# real profile URL to bring an icon back.
social:
  # X/Twitter handle for twitter:site / twitter:creator card tags (e.g. @hackita).
  twitter_handle: ''
  facebook: ''
  instagram: ''
  twitter: ''
  linkedin: ''

# GTranslate auto-translation widget.
# FREE tier is live now (enable: true, pro: false) — client-side widget, no
# account/key needed, but translated pages are NOT indexed by Google.
# To go PRO later: purchase GTranslate Pro, connect the site in their dashboard,
# then set `pro: true` here and redeploy. That switches on indexable translated
# URLs (/en/, /fr/ ...) + hreflang for SEO. No other code changes needed.
# The GTranslate Pro subscription is billed by GTranslate directly to the client.
gtranslate:
  enable: true
  pro: false
  widget: float            # float | dropdown | flags | popup | globe
  default_language: it
  languages:
    - it
    - en
    - fr
    - es
    - de
  switcher_horizontal_position: left
  switcher_vertical_position: bottom
  # Pro-only (ignored while pro: false):
  url_structure: sub_directory   # sub_directory (/en/) | sub_domain (en.)
