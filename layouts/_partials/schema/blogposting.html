{{- $brand := site.Params.brand | default "Hackita" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": "{{ .Permalink }}#article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}",
  "url": "{{ .Permalink }}",
  {{ with .Params.image }}
  "image": {
    "@type": "ImageObject",
    "url": "{{ . | absURL }}"
  },
  {{ end }}
  "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}",
  {{ with .Lastmod }}
  "dateModified": "{{ .Format "2006-01-02T15:04:05Z07:00" }}",
  {{ end }}
  "author": {
    "@type": "Organization",
    "@id": "{{ site.BaseURL }}#organization",
    "name": "{{ $brand }}",
    "url": "{{ site.BaseURL }}"
  },
  "publisher": {
    "@id": "{{ site.BaseURL }}#organization"
  }
  {{- /* optional trailing fields carry their own leading comma, so the
         object stays valid JSON whichever of them is missing */ -}}
  {{- with .Params.categories }},
  "articleSection": {{ jsonify . | safeJS }}
  {{- end }}
  {{- with .Params.tags }},
  "keywords": "{{ delimit . ", " }}"
  {{- end }}
}
</script>
