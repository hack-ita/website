{{- $brand := site.Params.brand | default "HackITA" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "{{ .Permalink }}#webpage",
  "url": "{{ .Permalink }}",
  "name": "{{ $brand }}",
  "inLanguage": "it-IT",
  "isPartOf": {
    "@id": "{{ site.BaseURL }}#website"
  },
  "about": {
    "@id": "{{ site.BaseURL }}#organization"
  }
}
</script>
