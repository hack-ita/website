<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "{{ .Permalink }}#webpage",
  "url": "{{ .Permalink }}",
  "name": "{{ .Title }}",
  "inLanguage": "{{ cond (eq (partial "seo/content-lang.html" .) "it") "it-IT" (partial "seo/content-lang.html" .) }}",
  "isPartOf": {
    "@id": "{{ site.BaseURL }}#website"
  }
}
</script>
