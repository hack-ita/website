{{- $brand := site.Params.brand | default "Hackita" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.BaseURL }}#website",
  "url": "{{ site.BaseURL }}",
  "name": "{{ $brand }}",
  "publisher": {
    "@id": "{{ site.BaseURL }}#organization"
  }
}
</script>
