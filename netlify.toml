[build.environment]
DART_SASS_VERSION = "1.93.2"
GO_VERSION = "1.25.3"
HUGO_VERSION = "0.152.2"
NODE_VERSION = "20"
TZ = "Europe/Oslo"

[build]
publish = "public"
# Force clean build by removing public directory first
command = "npm run build"
# Skip production builds (15 credits each) when only draft posts or repository files changed.
# Fail-safe: any other change, or any doubt, builds as before. See scripts/netlify-ignore.sh.
ignore = "bash scripts/netlify-ignore.sh"

# This ensures Netlify doesn't cache between builds
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true

# The GTranslate-served sub-domain (en.hackita.it) loads our fingerprinted
# CSS/JS cross-origin from hackita.it. Those files use Subresource Integrity
# (integrity + crossorigin="anonymous"), which requires CORS — without it the
# browser blocks them and the translated pages render unstyled / without JS.
# Security headers for every page (HSTS is already sent by Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# /css/ and /js/ only hold fingerprinted files (name = hash of the content, Hugo fingerprint): a change makes a new
# name, so browsers may keep them for a year without asking again.
[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
