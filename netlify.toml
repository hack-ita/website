[build.environment]
DART_SASS_VERSION = "1.93.2"
GO_VERSION = "1.25.3"
HUGO_VERSION = "0.152.2"
NODE_VERSION = "20"
TZ = "Europe/Oslo"

[build]
publish = "public"
# Force clean build by removing public directory first
command = "npm run build"

# This ensures Netlify doesn't cache between builds
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true

# The GTranslate-served sub-domain (en.hackita.it) loads our fingerprinted
# CSS/JS cross-origin from hackita.it. Those files use Subresource Integrity
# (integrity + crossorigin="anonymous"), which requires CORS — without it the
# browser blocks them and the translated pages render unstyled / without JS.
[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
