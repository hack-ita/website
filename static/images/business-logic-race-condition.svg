<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Race Condition: Check and Write Are Not Atomic</text>
  <g font-size="14" font-weight="bold" fill="#111111">
    <text x="20" y="92">Request A</text>
    <text x="20" y="152">Request B</text>
    <text x="20" y="232">Database</text>
  </g>
  <g stroke="#111111" stroke-width="2" font-size="14" text-anchor="middle">
    <rect x="130" y="68" width="190" height="40" rx="6" fill="#111111"/>
    <rect x="580" y="68" width="190" height="40" rx="6" fill="#dc2626" stroke="#dc2626"/>
    <rect x="340" y="128" width="190" height="40" rx="6" fill="#111111"/>
    <rect x="690" y="128" width="190" height="40" rx="6" fill="#dc2626" stroke="#dc2626"/>
    <rect x="130" y="208" width="750" height="44" rx="6" fill="#ffffff"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">
    <text x="225" y="93">1. used? -&gt; no</text>
    <text x="675" y="93">3. write: used</text>
    <text x="435" y="153">2. used? -&gt; no</text>
    <text x="785" y="153">4. write: used</text>
  </g>
  <text x="505" y="236" text-anchor="middle" font-size="15" fill="#111111">flag "used" is still false when both checks run</text>
  <g stroke="#dc2626" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#r2)">
    <line x1="225" y1="110" x2="225" y2="206"/>
    <line x1="435" y1="170" x2="435" y2="206"/>
  </g>
  <rect x="130" y="268" width="750" height="44" rx="6" fill="#111111"/>
  <text x="505" y="296" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">Result: one coupon, applied twice. With 20 parallel requests: 20 times.</text>
</svg>
